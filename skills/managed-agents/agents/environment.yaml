kind: environment
name: henry-cloud

# Deny-by-default egress. The sandbox cannot phone home to an arbitrary host,
# which is the containment that matters when an agent reads untrusted input.
#
# This does NOT cost the agents their research ability: web_search and web_fetch
# execute on Anthropic's servers, not in the container, so `networking` never
# governs them. Restrict those per-tool with allowed_domains / blocked_domains
# on the agent's toolset config instead.
config:
  type: cloud
  networking:
    type: limited
    # pip / npm / apt so an agent can install what a task needs.
    allow_package_managers: true
    # Reach the agent's declared MCP servers without listing each domain.
    allow_mcp_servers: true
    allowed_hosts:
      - api.github.com
      - raw.githubusercontent.com

x-notes: |
  Switch to {type: unrestricted} only for a session that genuinely needs
  arbitrary egress, and prefer a second environment over loosening this one -
  environment updates apply to NEW containers only, so a running session keeps
  the config it started with either way.

  A secret the sandbox needs (Stripe key, Twilio key, ...) does NOT go here and
  does not go in a system prompt. Put it in a vault `environment_variable`
  credential: the sandbox sees an opaque placeholder and Anthropic substitutes
  the real value at egress, so nothing in the container can read or exfiltrate
  it. Both layers must allow the host - the credential's own allowed_hosts AND
  this environment's.
