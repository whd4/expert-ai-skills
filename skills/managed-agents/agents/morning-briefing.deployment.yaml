kind: deployment
name: henry-morning-briefing

# Resolved to real IDs at deploy time from agents/state.json, so this file
# stays readable and portable across workspaces.
agent_name: Atlas
environment_name: henry-cloud

# A deployment fires with NO client attached. Atlas normally gates `bash`
# behind always_ask, which would park every firing in requires_action forever.
# This override (the API's `agent_with_overrides` form) replaces the tool list
# for the scheduled run only - overrides never merge, so the whole toolset is
# restated here with bash disabled. `model`/`system` are inherited; note that an
# `effort` inside an override is silently ignored by the API.
agent_overrides:
  tools:
    - type: agent_toolset_20260401
      default_config:
        enabled: true
        permission_policy:
          type: always_allow
      configs:
        - name: bash
          enabled: false
        - name: web_search
          user_location:
            type: approximate
            city: Houston
            region: Texas
            country: US
            timezone: America/Chicago
        - name: web_fetch
          max_content_tokens: 50000

# Hard cap copied onto every fired session. Minor units as a string: "500" = $5.00.
# `deploy --budget N` overrides this; `deploy` refuses if neither is present.
budget:
  type: limit
  max_list_cost:
    amount: "500"
    currency: USD

schedule:
  type: cron
  # 07:10 local, Monday-Friday. Deliberately outside 01:00-03:59: cron matches
  # literal wall-clock, so a DST spring-forward SKIPS a time in that window and
  # a fall-back fires it TWICE.
  expression: "10 7 * * 1-5"
  timezone: America/Chicago

initial_events:
  - type: user.message
    content:
      - type: text
        text: |
          Produce this morning's briefing for HENRY AI Corporation. Keep it to
          one page and lead with the bottom line.

          1. Track 2 pipeline: the current acquisition targets are listed in
             /workspace/pipeline.md if the operator mounted it this run. If it
             is not present, say so and skip this section - do not guess at
             targets. For each listed target, search for anything new that is
             publicly reported about the firm or its local market. Cite each
             item with URL and retrieval date. If there is nothing new, say
             "no change" - do not manufacture movement.
          2. Houston market signal for Track 1: one or two developments that
             would change who is worth approaching this week, with sources.
          3. The single highest-leverage action available today, and what it
             costs. If it creates a recurring cost, name what would have to be
             sold to pay for it.
          4. Anything you could NOT verify - list it plainly under "unverified".

          Write the briefing to /mnt/session/outputs/briefing-<YYYY-MM-DD>.md.
          Do not send it anywhere.

x-notes: |
  This file is committed to a PUBLIC repository. Pipeline identifiers, deal
  terms, and anything else you would not put on a billboard belong in a
  mounted file resource or the session prompt - never here.

  Fire times are jittered up to 15% of the interval (floor 5s, cap 9 minutes),
  so a daily deployment can land several minutes off the listed time. Never
  hang a downstream deadline on `upcoming_runs_at`.

  Test it before trusting the schedule:
    python -m engine deploy agents/morning-briefing.deployment.yaml --dry-run
    # then, once created, a manual fire (works even while paused):
    #   POST /v1/deployments/{id}/run

  Pause the deployment (reversible) rather than archiving it (terminal) if you
  need it to stop.
